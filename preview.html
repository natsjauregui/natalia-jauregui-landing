<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Previa Multidispositivo // Natalia Jauregui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #080808;
            color: #E0E0E0;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: auto;
        }

        /* Header de Control */
        .preview-header {
            background: #111111;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 3px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-badge {
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 2px;
            color: #A0A0A0;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .btn-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFF;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-control:hover {
            background: #FFFFFF;
            color: #080808;
        }

        /* Contenedor Principal de Dispositivos */
        .devices-workspace {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 40px;
            padding: 30px 20px 60px;
            flex-grow: 1;
        }

        /* Mockups de Dispositivos */
        .device-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .device-label {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #A0A0A0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Marco Móvil */
        .mobile-frame {
            width: 390px;
            height: 800px;
            background: #000;
            border: 8px solid #222;
            border-radius: 44px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 255, 255, 0.08);
            overflow: hidden;
            position: relative;
        }

        /* Marco Tableta */
        .tablet-frame {
            width: 720px;
            height: 800px;
            background: #000;
            border: 10px solid #222;
            border-radius: 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 255, 255, 0.08);
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0D0D0D;
        }

        .network-hint {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #888;
            text-align: center;
            margin: 20px auto 10px;
            max-width: 700px;
        }
        .network-hint strong {
            color: #FFF;
        }
    </style>
</head>
<body>

    <header class="preview-header">
        <div class="brand-title">
            <i class="fa-solid fa-layer-group" style="color: #D4A5A5;"></i>
            NATALIA JAUREGUI
            <span class="brand-badge">SIMULADOR MULTIDISPOSITIVO</span>
        </div>
        <div class="controls">
            <button class="btn-control" onclick="reloadFrames()">
                <i class="fa-solid fa-rotate-right"></i> Recargar Todo
            </button>
            <a href="index.html" class="btn-control" target="_blank">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Abrir Escritorio
            </a>
        </div>
    </header>

    <div class="network-hint">
        <i class="fa-solid fa-wifi" style="margin-right: 6px;"></i>
        También puedes abrir <strong>http://192.168.1.15:8080</strong> directamente desde tu celular o tableta conectados a tu WiFi.
    </div>

    <main class="devices-workspace">
        
        <!-- Vista Móvil -->
        <div class="device-card">
            <div class="device-label">
                <i class="fa-solid fa-mobile-screen"></i> Celular (iPhone / 390px)
            </div>
            <div class="mobile-frame">
                <iframe id="iframe-mobile" src="index.html"></iframe>
            </div>
        </div>

        <!-- Vista Tableta -->
        <div class="device-card">
            <div class="device-label">
                <i class="fa-solid fa-tablet-screen-button"></i> Tableta (iPad / 720px)
            </div>
            <div class="tablet-frame">
                <iframe id="iframe-tablet" src="index.html"></iframe>
            </div>
        </div>

    </main>

    <script>
        function reloadFrames() {
            document.getElementById('iframe-mobile').src = 'index.html?t=' + new Date().getTime();
            document.getElementById('iframe-tablet').src = 'index.html?t=' + new Date().getTime();
        }
    </script>
</body>
</html>
